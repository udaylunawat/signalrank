resume:
  default_path: users/example/default/resume/resume.tex
  allowed_formats:
  - pdf
  - tex
  pdf:
    max_pages: 20
  latex:
    strip_comments: true
    collapse_whitespace: true
    
  embedding_prefix: >
    Agentic AI, LLM systems, inference, evaluation, orchestration.

  embedding_prefix_by_use_case:
    network_engineer: >
      Network automation, network infrastructure, routing, switching,
      firewalls, network operations, reliability engineering, scripting,
      infrastructure automation.

    ml: >
      Machine learning engineering, model training, deployment,
      ML pipelines, production ML systems.
  embedding:
    mode: prefix_plus_skills
    separator: ' '
