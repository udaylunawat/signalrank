version: 1

profile_intent:
  preset: Enterprise / Platform Architect

# ============================================================
# RANKING
# ============================================================
ranking:
  min_semantic_score: 0.10
  semantic_company_floor: 0.7

  # Allow architecture-first roles only
  allowed_functional_roles:
    - architecture_strategy
    - product_strategy
    - customer_facing

  # Do NOT block principal (common IC architect title)
  hard_title_blocklist:
    - manager
    - director
    - head
    - vp

  # Functional role penalties
  functional_role_penalties:
    architecture_strategy: 1.0
    product_strategy: 0.9
    customer_facing: 0.85
    software_general: 0.4
    platform_devops: 0.3
    mlops_llmops: 0.2
    agentic_systems: 0.2

  # Experience shaping
  max_yoe_cap: 20
  yoe_penalty_threshold: 16
  yoe_mismatch_penalty: 0.8

  enable_recency_decay: true
  recency_half_life_days: 30

  # Skill overlap is weak for architects → disable
  skill_overlap:
    enabled: false

# ============================================================
# SEARCH / QUERY PLANNING
# ============================================================
search:
  anchors:
    - enterprise architect
    - platform architect
    - principal architect
    - solution architect
    - digital transformation architect

  invalid_tokens:
    - hands on developer
    - pure coding
    - junior
    - internship
    - sprint velocity
    - bug fixing

# ============================================================
# COMPANY SCORING
# ============================================================
company_scoring:
  preferred_companies:
    - siemens
    - schneider electric
    - abb
    - ge
    - bosch
    - philips
    - honeywell
    - rockwell automation
    - tata group
    - reliance industries
    - larsen & toubro
    - mahindra group
    - accenture
    - deloitte
    - pwc
    - kpmg
    - ey

  deprioritized_companies:
    - wipro
    - infosys
    - tcs
    - hcl
    - tech mahindra
    - capgemini
    - ibm