name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "desktop-v0.2.1"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: dmg,app
          - name: Windows
            os: windows-latest
            bundles: nsis,msi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            signalrank/desktop/package-lock.json
            signalrank/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xvfb

      - name: Install frontend dependencies
        working-directory: signalrank/frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: signalrank/backend
        run: uv sync --dev

      - name: Install desktop dependencies
        working-directory: signalrank/desktop
        run: npm ci

      - name: Build backend sidecar
        working-directory: signalrank/desktop
        run: npm run build:backend

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        working-directory: signalrank/desktop
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $certificatePath = Join-Path $env:RUNNER_TEMP "signalrank-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, $bytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $certificate.Thumbprint -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json

      - name: Detect Apple signing certificate
        id: apple-signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and attach signed desktop artifacts
        if: steps.apple-signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNALRANK_MODE: desktop
          NEXT_PUBLIC_SIGNALRANK_MODE: desktop
        with:
          projectPath: signalrank/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "SignalRank ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Cross-platform local-first SignalRank desktop release."
          releaseDraft: true
          includeUpdaterJson: false
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Build and attach ad-hoc desktop artifacts
        if: steps.apple-signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
          SIGNALRANK_MODE: desktop
          NEXT_PUBLIC_SIGNALRANK_MODE: desktop
        with:
          projectPath: signalrank/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "SignalRank ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Cross-platform local-first SignalRank desktop release."
          releaseDraft: true
          includeUpdaterJson: false
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Packaged lifecycle smoke test
        working-directory: signalrank/desktop
        env:
          SIGNALRANK_SMOKE_EXIT_AFTER_READY: "5"
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a npm run smoke:packaged
          else
            npm run smoke:packaged
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signalrank-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            signalrank/desktop/src-tauri/target/release/bundle/**/*.dmg
            signalrank/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            signalrank/desktop/src-tauri/target/release/bundle/**/*.exe
            signalrank/desktop/src-tauri/target/release/bundle/**/*.msi
            signalrank/desktop/src-tauri/target/release/bundle/**/*.AppImage
            signalrank/desktop/src-tauri/target/release/bundle/**/*.deb
            signalrank/desktop/src-tauri/target/release/bundle/**/*.rpm
            signalrank/desktop/src-tauri/target/release/bundle/**/*.sig
