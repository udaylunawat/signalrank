# ============================================================
# User Override — EXAMPLE
# Persona: Senior ML / AI Platform Engineer
# ============================================================

# --------------------
# RESUME / EMBEDDING INTENT
# --------------------
resume:
  embedding_prefix: >
    AI Platform Engineer, MLOps, LLM systems, LLMOps
    production ML platforms, AI infrastructure, agentic systems.

  distilled_text: >
    Experienced AI platform engineer with 7 years building
    cloud-agnostic ML infrastructure, agent orchestration,
    CI/CD systems, and FinOps-aware deployments.
# --------------------
# FUNCTIONAL ROLE PREFERENCE
# --------------------
ranking:
  default_role: mlops_llmops
  scoring_weights:
    skills_match: 0.45
    company_fit: 0.15
    seniority: 0.15
    location: 0.15
    recency: 0.10
  functional_role_penalties:
    agentic_systems: 1.2
    mlops_llmops: 1.2
    platform_devops: 1.2
    software_general: 0.85
# --------------------
# ROLE VOCABULARY (PERSONA SIGNAL)
# --------------------
functional_role_terms:
