# ============================================================
# Job Ranker v2 — BASE CONFIG (ENGINE ONLY)
# Role-agnostic, persona-free, deterministic
# ============================================================

version: 1

paths:
  db_path: duckdb

# --------------------
# EMBEDDINGS (ENGINE)
# --------------------
embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
  device: cpu
  text:
    normalize_embeddings: true
    max_chars: 2000

# --------------------
# RANKING MECHANICS (NEUTRAL)
# --------------------
ranking:
  min_semantic_score: 0.30
  enable_recency_decay: true
  recency_half_life_days: 21

  seniority_penalty:
    junior_multiplier: 0.4
    low_yoe_multiplier: 0.5
    title_keywords:
      junior:
        - intern
        - junior
        - entry

  # Neutral defaults — no role preference here
  functional_role_penalties:
    agentic_systems: 1.0
    mlops_llmops: 1.0
    platform_devops: 1.0
    software_general: 1.0

  llm_veto:
    enabled: false
    model_max_tokens: 200
    penalty_multiplier: 0.65

# --------------------
# COMPANY (NEUTRAL)
# --------------------
company_scoring:
  default_weight: 1.0

# --------------------
# SKILLS (CANONICALIZATION)
# --------------------
skills:
  equivalence_groups: {}

# --------------------
# SCRAPING DEFAULTS
# --------------------
scraping:
  country: India
  max_results: 500
  min_description_length: 0
  use_multiprocessing: true
  sites:
    enabled:
      - indeed
      - linkedin
      - glassdoor

# --------------------
# ROLE TAXONOMY (VOCABULARY ONLY)
# --------------------
functional_role_terms:
  ai: []
  devops: []
  security: []

functional_role_taxonomy:
  architecture_strategy:
    keywords:
      - enterprise architect
      - platform architect
      - solution architect
  customer_facing:
    keywords:
      - solutions engineer
      - pre-sales
      - sales engineer

functional_role_thresholds:
  security_min_terms: 2
  agentic_min_terms: 3
  mlops_ai_terms: 1
  mlops_devops_terms: 1
  platform_devops_min_terms: 2