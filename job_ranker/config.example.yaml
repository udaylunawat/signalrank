# Mini Ranker — Example Config
# Copy to config.yaml and edit to match your profile.
# Run: python mini_ranker.py --setup  (for interactive setup)

# Your resume — path to file (PDF, TXT, TEX) or inline text
# resume_file takes precedence over inline resume
resume_file: ~/resume.pdf
# resume: |
#   Your resume summary text here...
#   Skills, experience, tools, etc.

# What roles are you looking for?
search_queries:
  - ai platform engineer
  - ml platform engineer
  - mlops
  - llmops
  - genai
  - agentic systems
  - ai infrastructure

country: India
hours_old: 240

preferred_locations:
  - pune
  - remote
  - maharashtra

# Companies you'd love to work at (mapped to top tier, score: 100)
top_companies:
  - databricks
  - openai
  - nvidia
  - anthropic
  - google
  - meta
  - apple
  - netflix
  - stripe

# Companies that are good but not dream (tier A, score: 85)
good_companies:
  - intuit
  - atlassian
  - bloomberg
  - flipkart
  - walmart
  - visa

# Companies to deprioritize (tier D, score: 15)
avoid_companies:
  - wipro
  - infosys
  - tcs
  - cognizant
  - accenture

# Job titles to filter out entirely (word-boundary match)
title_blocklist:
  - trainee
  - manager
  - sales
  - junior
  - director
  - qa engineer
  - sdet

# Max years of experience in job requirements
max_yoe: 10

# Advanced (optional — sensible defaults built in)
# Uncomment and edit only if you want fine-grained control.
# advanced:
#   okay_companies: [optum, siemens, philips]      # tier B, score: 65
