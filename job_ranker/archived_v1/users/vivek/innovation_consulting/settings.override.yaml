# ============================================================
# Vivek Gupta — Strategy, Architecture & Innovation IC
# ============================================================

version: 1

profile_intent:
  preset: Strategy / Architecture / Innovation

# ============================================================
# RANKING
# ============================================================
ranking:
  hard_title_blocklist:
    - manager
  allowed_functional_roles:
    - architecture_strategy
    - innovation_rnd
    - product_strategy
    - customer_facing
  min_semantic_score: 0.15

  # Vivek is cross-domain but senior; avoid generic JD matches
  semantic_company_floor: 0.65

  # -------------------------------
  # Functional role penalties
  # -------------------------------
  functional_role_penalties:
    architecture_strategy: 1.0
    innovation_rnd: 1.0
    product_strategy: 0.95
    manager: 0.7
    # Acceptable but secondary
    product: 0.7
    customer_facing: 0.7

    # Hard deprioritization
    software_general: 0.5
    platform_devops: 0.2
    mlops_llmops: 0.2
    agentic_systems: 0.1
    qa: 0.1
    support: 0.1

  # -------------------------------
  # Experience shaping
  # -------------------------------
  max_yoe_cap: 18
  yoe_penalty_threshold: 14
  yoe_mismatch_penalty: 0.7

  enable_recency_decay: true
  recency_half_life_days: 30

# ============================================================
# COMPANY SCORING
# ============================================================
company_scoring:
  default_weight: 0.45

  preferred_companies:
    # Indian enterprise & industrial majors
    - tata group
    - reliance industries
    - larsen & toubro
    - mahindra group
    - godrej group
    - adani group
    - tvs group

    # Global industrial / automation leaders
    - siemens
    - schneider electric
    - honeywell
    - bosch
    - abb
    - ge
    - hitachi
    - rockwell automation
    - mitsubishi electric
    - bain
    - mckinsey
    - bcg
    - accenture
    - deloitte
    - kpmg
    - ey
    - pwc
    - capco
    - cognizant
    - infosys

  deprioritized_companies:
    - wipro
    - hcl
    - tech mahindra
    - capgemini
    - ibm
    - epam
    - globallogic

# ============================================================
# PROFILES
# ============================================================
profiles:
  senior_ic:

    skip_junior_roles: true
    skip_manager_roles: false   # Allows "Lead" but filtered via titles and authority

    exclude_keywords:
      - intern
      - internship
      - fresher
      - junior
      - trainee
      - student
      - faculty
      - professor
      - lecturer
      - hr
      - recruiter
      - sales
      - marketing
      - technician
      - operator
      - software engineer
      - backend
      - frontend
      - full stack
      - devops
      - sre
      - qa
      - test
      - support
      - maintenance

    hard_title_blocklist:
      - intern
      - junior
      - graduate

# ============================================================
# SEARCH / QUERY PLANNING
# ============================================================
search:
  anchors:
    - enterprise architect
    - platform architect
    - digital transformation architect
    - principal architect
    - solution architect enterprise

  invalid_tokens:
    - pure coding
    - hands on developer
    - junior
    - internship
    - sprint velocity
    - story points
    - ticket based
    - bug fixing

# ============================================================
# EMBEDDING CONTEXT
# ============================================================
resume_embedding_prefix: >
  Enterprise innovation, industrial digital transformation, system and platform
  architecture, industrial IoT, connected products, R&D and innovation strategy,
  technology investment decisions, architecture governance, cross-functional
  leadership, product-to-market alignment.