search:
  prompt: |
    Generate job search queries from this role intent.

    Rules:
    - One role per query
    - No OR operators
    - Suitable for job boards
    - Senior IC focused
    - Use standard industry titles only

    Return JSON:
    { "queries": [...] }

    ROLE:
    <<<TEXT>>>

  min_query_length: 6
  anchors: []
  invalid_tokens: []
  normalization: {}

  literal_query_rules:
    forbid_tokens:
      - " or "
      - "|"
    min_words: 3

  persona_overrides:
    strategy:
      extra_queries:
        - enterprise architect
        - platform architect
        - principal architect
        - digital transformation architect