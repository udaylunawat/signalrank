version: 2

embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
  device: cpu
  text:
    normalize_embeddings: true
    max_chars: 50000

ranking:
  min_semantic_score: 0.20
  broader_match_semantic_score: 0.18
  broader_match_score_cap: 64
  max_job_age_days: 30
  company_semantic_floor: 0.65
  hidden_gem_semantic_threshold: 0.70
  hidden_gem_company_bonus: 60
  contract_penalty: 0.9
  relevant_feedback_bonus: 5
  not_relevant_feedback_penalty: 35
  scoring_weights:
    skills_match: 0.40
    company_fit: 0.20
    seniority: 0.15
    location: 0.15
    recency: 0.10
  seniority_penalty:
    junior_multiplier: 0.4
    low_yoe_multiplier: 0.5
    over_senior_multiplier: 0.7
    title_keywords:
      junior:
        - intern
        - junior
        - entry
      over_senior:
        - director
        - head of
        - chief

company_scoring:
  aliases:
    amazon.com: amazon
    jpmorganchase: jpmorgan chase
    google india: google
    meta platforms: meta
    microsoft india: microsoft

skills:
  equivalence_groups: {}
