<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignalRank</title>
    <style>
      :root {
        color-scheme: light;
        background: #f8f7fc;
        color: #262436;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at 8% 0%, #e8e4fa 0, transparent 34rem),
          radial-gradient(circle at 96% 8%, #e5f5f0 0, transparent 28rem),
          #f8f7fc;
      }
      main {
        display: grid;
        justify-items: center;
        width: min(22rem, calc(100vw - 3rem));
        gap: 0;
        padding: 2.5rem 2rem;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 1.4rem;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 1px 2px rgba(35, 31, 61, 0.04),
          0 18px 50px rgba(78, 66, 145, 0.08);
        backdrop-filter: blur(18px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
      }
      .mark {
        display: grid;
        width: 2.4rem;
        height: 2.4rem;
        place-items: center;
        border-radius: 0.8rem;
        background: #6557c8;
        color: white;
        box-shadow: 0 8px 22px rgba(89, 73, 205, 0.24);
        font-size: 1.1rem;
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        margin-top: 2rem;
        border: 2px solid #e7e4f1;
        border-top-color: #6557c8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .status {
        margin-top: 1rem;
        color: #777388;
        font-size: 0.875rem;
        letter-spacing: -0.01em;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true">✦</span>
        <h1>SignalRank</h1>
      </div>
      <div class="spinner" aria-label="Starting"></div>
      <div class="status">Opening your local workspace…</div>
    </main>
  </body>
</html>
