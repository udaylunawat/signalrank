[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-ranker"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "streamlit",
  "duckdb",
  "pandas",
  "numpy",
  # speedyapply fork — has hours_old support for Indeed
  # Install with: pip install git+https://github.com/speedyapply/JobSpy.git
  # or locally:  pip install -e path/to/JobSpy
  # "python-jobspy",  # original PyPI — no hours_old support
  "tls-client", # better TLS fingerprinting for Google Jobs scraper
  "sentence-transformers",
  "fastembed",
  "onnxruntime",
  "PyPDF2",
  "tqdm",
  "python-dotenv",
  "aiohttp",
  "pydantic",
  "litellm",
  "gitingest",
  "pyyaml",
  "beautifulsoup4>=4.14.3",
  "lxml>=6.0.2",
  "duckduckgo-search>=6.0.0",
  "ddgs>=9.11.4",
  "jobspy>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "isort",
]

[project.scripts]
job-ranker = "job_ranker.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_ranker*"]

[tool.setuptools.package-data]
job_ranker = ["**/*"]

[tool.black]
line-length = 88
target-version = ["py311"]

exclude = '''
(
  \.venv
| cache
| job_ranker\.egg-info
)
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["job_ranker"]
combine_as_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"job_ranker/app/pages/*.py" = ["E402"]
