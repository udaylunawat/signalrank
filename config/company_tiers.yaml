default_weight: 0.4

tiers:

  enterprise_calm:
    description: >
      Large, stable enterprises with long system lifecycles,
      strong IC/architect tracks, and predictable work.
    weight: 1.0
    companies:
      - walmart
      - optum
      - unitedhealth
      - jpmorgan
      - jp morgan
      - eli lilly
      - siemens
      - philips
      - ge healthcare
      - msci
      - visa
      - mastercard
      - capital one
      - intuit
      - workday
      - atlassian
      - salesforce

  enterprise_saas_finance:
    description: >
      Strong product or finance firms with good pay
      and solid IC ladders, slightly higher expectations.
    weight: 0.95
    companies:
      - salesforce
      - adobe
      - blackrock
      - goldman

  big_tech_controlled:
    description: >
      Big Tech with high bar and high upside.
      Calm depends heavily on team and scope.
    weight: 0.92
    companies:
      - microsoft
      - google
      - apple
      # amazon intentionally excluded (too high variance)

  delivery_ai_services:
    description: >
      AI-heavy service firms with variable calm depending on client.
      Good learning, weaker long-term calm.
    weight: 0.5
    companies:
      - fractal
      - epam
      - globallogic
      - nagarro
      - citiustech

  legacy_it_services:
    description: >
      Traditional IT services with lower leverage,
      slower growth, and weaker long-term satisfaction.
    weight: 0.3
    companies:
      - wipro
      - infosys
      - tcs
      - hcl
      - tech mahindra
      - cognizant
      - capgemini
      - ibm